version: 1.0
runtime: python312
build:
  commands:
    build:
      # Install Node.js for frontend build
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
      # Build frontend
      - cd frontend && npm install && npm run build && cd ..
      # Install backend dependencies
      - pip install -r backend/requirements.txt
  env:
    - name: NODE_ENV
      value: "production"
run:
  command: cd backend && cp -r ../frontend/dist ./static && uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: DATABASE_URL
      value: "sqlite:///./learning_companion.db"
    - name: CORS_ORIGINS
      value: "*"
